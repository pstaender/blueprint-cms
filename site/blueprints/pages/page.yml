title: Page
default: true

fields:
  title:
    type: text
  content:
    type: textarea
  metaIndex:
    label: Meta Index
    type: toggle
  files:
    label: Files
    type: filelist
  createdAt:
    label: Created
    type: datetime
    disabled: true
    width: 1/2
  modifiedAt:
    label: Modified
    type: datetime
    disabled: true
    width: 1/2

tabs:
  content:
    columns:
      - width: 2/3
        fields: true
      - width: 1/3
        fields:
          - files
  meta:
    fields:
      - metaIndex
      - createdAt
      - modifiedAt

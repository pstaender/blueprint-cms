fields:
  title: text
  body:
    type: blocks
    fieldsets: [heading, text, image]
  grid:
    type: layout
    layouts: ["1/1", "1/2, 1/2"]
    fieldsets:
      heading: true
      callout:
        title: Callout
        fields:
          text:
            type: text
            required: true
  everything: blocks
  nested:
    type: blocks
    fieldsets: [section]

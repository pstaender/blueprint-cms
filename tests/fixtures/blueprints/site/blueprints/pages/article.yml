title: Article
icon: 📝

fields:
  title:
    type: text
    required: true
  date:
    type: date
    default: today
  category:
    type: select
    options: [news, review]
    default: news
  email: true
  links:
    type: structure
    min: 1
    fields:
      url:
        type: url
        required: true
  seo: custom-fields/seo

tabs:
  content:
    columns:
      - width: 2/3
        fields:
          - title
          - links
          - text:
              type: textarea
      - width: 1/3
        fields:
          - date
          - category
          - email
  seo:
    label: Search engines
    fields:
      - seo
  disabled: false
